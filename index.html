<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Numerology Analysis</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Arial',sans-serif;
    background: linear-gradient(135deg, #caafe0 0%, #350c48 100%);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container {
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    max-width:800px;
    width:100%;
}

h1 {
    text-align:center;
    color:#764ba2;
    margin-bottom:10px;
    font-size:28px;
}

.subtitle {
    text-align:center;
    color:#667eea;
    margin-bottom:30px;
    font-size:14px;
    font-style:italic;
}

.input-group {
    margin-bottom:20px;
}

label {
    display:block;
    margin-bottom:8px;
    color:#764ba2;
    font-weight:bold;
    font-size:14px;
}

input {
    width:100%;
    padding:12px;
    font-size:16px;
    border:2px solid #ddd;
    border-radius:8px;
    transition:border-color 0.3s;
}

input:focus {
    outline:none;
    border-color:#667eea;
}

button {
    width:100%;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background: linear-gradient(135deg, #caafe0 0%, #350c48 100%);
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition: transform 0.2s;
    margin-top:10px;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity:0.6;
    cursor:not-allowed;
}

.loading {
    display:none;
    text-align:center;
    color:#764ba2;
    margin:20px 0;
    font-style:italic;
}

.loading.show { display:block; }

.results {
    display:none;
    margin-top:30px;
    padding:25px;
    background:linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
    border-radius:15px;
    border:2px solid #764ba2;
}

.results.show { display:block; }

.results h2 {
    color:#764ba2;
    margin-bottom:20px;
    text-align:center;
    font-size:22px;
}

.results ul {
    list-style:none;
    padding:0;
}

.results li {
    padding:12px;
    margin:10px 0;
    background:white;
    border-left:4px solid #667eea;
    border-radius:8px;
    line-height:1.6;
    color:#333;
}

.results li strong {
    color:#764ba2;
}

.error {
    display:none;
    padding:15px;
    background:#fee;
    border:2px solid #f66;
    border-radius:8px;
    color:#c33;
    margin-top:15px;
    text-align:center;
}

.error.show { display:block; }

.energies-display {
    text-align:center;
    margin:15px 0;
    padding:15px;
    background:rgba(102,126,234,0.1);
    border-radius:10px;
    font-size:14px;
    color:#764ba2;
}

.footer {
    text-align:center;
    margin-top:30px;
    font-size:11px;
    color:#999;
}
</style>
</head>
<body>

<div class="container">

    <div class="input-group">

    <button onclick="analyze()">Analyze Person</button>

    <div class="results" id="results">
        <div class="energies-display" id="energies"></div>

        <ul id="bulletPoints"></ul>

    <div class="footer">KARMA_DECODED | Maria Fistican | © All Rights Reserved</div>

<script>
// Auto-format date input
document.getElementById('dob').addEventListener('input', function(e){
    let value = e.target.value.replace(/\D/g, '');
    if(value.length >= 2) value = value.substring(0,2) + '/' + value.substring(2);
    if(value.length >= 5) value = value.substring(0,5) + '/' + value.substring(5);
    e.target.value = value.substring(0,10);
});

function reduceToMax22(num){
    while(num>22) num=num.toString().split('').reduce((s,d)=>s+parseInt(d),0);
    return num;
}

async function analyze(){
    const dob = document.getElementById('dob').value.trim();
    const error = document.getElementById('error');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    
    // Hide previous results
    error.classList.remove('show');
    results.classList.remove('show');
    
    // Validate inputs
    if(!/^\d{2}\/\d{2}\/\d{4}$/.test(dob)){
        error.textContent = 'Invalid date format. Use DD/MM/YYYY';
        error.classList.add('show');
        return;
    }
    
    const [day,month,year] = dob.split('/').map(Number);
    if(day<1||day>31||month<1||month>12){
        error.textContent = 'Invalid date. Please check the day and month.';
        error.classList.add('show');
        return;

    // Calculate energies
    const A = reduceToMax22(day);
    const B = reduceToMax22(month);
    const C = reduceToMax22(year.toString().split('').reduce((s,d)=>s+parseInt(d),0));
    const D = reduceToMax22(A+B+C);
    const E = reduceToMax22(A+B+C+D);
    const M = reduceToMax22(A+B);
    const N = reduceToMax22(B+C);
    const O = reduceToMax22(C+D);
    const P = reduceToMax22(D+E);
    const Q = reduceToMax22(E+A);
    const CENTER = reduceToMax22(A+B+C+D+E);
    
    // Display energies
    document.getElementById('energies').innerHTML = `
        <strong>Key Energies:</strong>

=== SOUL MISSIONS (CENTER) ===
1: Lead and share knowledge, master thought power, be spiritual guide.
2: Give unconditional love, serve people, reveal healing abilities.
3: Become parent and teacher, pass knowledge to next generation.
4: Embody masculine strength, create opportunities for others to prosper.
5: Become spiritual teacher, carry forward lineage traditions with new vision.
6: Help others awaken sexuality healthily, embody love and harmony.
7: Be warrior-leader, engage in service, show people how to live actively.

    const prompt = `You are analyzing person born ${dob} using Matrix of Destiny numerology.

CALCULATED ENERGIES:
- Personality/Talent (Day ${day}): Energy ${A}
- Spiritual Mission (Month ${month}): Energy ${B}
- Wealth/Career (Year ${year}): Energy ${C}
- Relationships: Energy ${D}
- Health: Energy ${E}
- Soul Mission (Center): Energy ${CENTER}
- Ancestral Programs: ${M}, ${N}, ${O}, ${P}, ${Q}

MATRIX KNOWLEDGE BASE:
${matrixKnowledge}

Using ONLY the matrix knowledge above, create 12-15 concise talking points for a live reading. Write as if speaking directly to the client in second person ("You are...").

Structure the points to cover:
1-2 points: Core personality strengths from Energy ${A}
2-3 points: Main challenges/blocks from Energy ${A}
1-2 points: Spiritual path from Energy ${B}
1-2 points: Career/money patterns from Energy ${C}
1-2 points: Relationship style from Energy ${D}
1 point: Health focus from Energy ${E}
1-2 points: Soul mission from Energy ${CENTER}
1-2 points: Most important ancestral pattern to work through

Be direct, specific, and insightful. Each point 1-2 sentences max. Format as bullet points starting with dash (-).`;

    try {
        // Call YOUR Vercel backend (NOT Google directly)
        const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });
        
        const data = await response.json();
        
        console.log('Response data:', data); // Debug log
        
        if(!data.success){
            throw new Error(data.error || 'API request failed');
        }
        
        if(!data.text){
            throw new Error('No text received from server');
        }
        
        const text = data.text;
        
        // Parse bullet points
        const bullets = text.split('\n')
            .filter(line => line.trim().startsWith('-'))
            .map(line => line.trim().substring(1).trim());
        
        if(bullets.length === 0){
            throw new Error('No bullet points found in response');
        }
        
        // Display results
        const ul = document.getElementById('bulletPoints');
        ul.innerHTML = '';
        
        bullets.forEach(bullet => {
            const li = document.createElement('li');
            li.textContent = bullet;
            ul.appendChild(li);
        });
        
        loading.classList.remove('show');
        results.classList.add('show');
        
    } catch(err) {
        loading.classList.remove('show');
        error.textContent = `Error: ${err.message}. Please try again.`;
        error.classList.add('show');
    }
}
</script>

</body>
</html>
